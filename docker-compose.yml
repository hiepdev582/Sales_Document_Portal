version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Database Service: PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sales_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: sales_password_secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sales_portal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d sales_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache & Revocation Store: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sales_portal_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - sales_portal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Secrets Management: HashiCorp Vault
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.15.0
    container_name: sales_portal_vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root_dev_token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - sales_portal_net
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sales_portal_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
